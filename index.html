<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لحظة من عمرك</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      margin-top: 50px;
      font-size: 36px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    #app {
      display: none;
      padding: 40px 20px;
    }
  </style>
</head>

<body>

  <div class="container" id="welcome">
    <h1>لحظة من عمرك</h1>

    <p>
      مرحبًا بك في تطبيق لحظة من عمرك
    </p>

    <p>
      احتفظ بلحظاتك وذكرياتك في مكان واحد.
    </p>

    <button onclick="startApp()">
      ابدأ الآن
    </button>
  </div>

  <div id="app">
    <h1>أهلًا بك في لحظة من عمرك ❤️</h1>

    <p>
      اختر ما تريد القيام به.
    </p>
  </div>

  <script>
    function startApp() {
      document.getElementById("welcome").style.display = "none";
      document.getElementById("app").style.display = "block";
    }
  </script>

</body>
</html>
